<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ก.พ.">
  <title>ก.พ. Trainer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">ก.พ. Trainer</h1>
    <div class="row">
      <span id="streak" class="streak" title="วันติดต่อกัน">🔥 0</span>
      <a href="#settings" class="gear" aria-label="ตั้งค่า">⚙️<i id="syncdot" data-state="off"></i></a>
    </div>
  </header>

  <div id="linebar" class="linebar" hidden>
    เปิดอยู่ในแอป LINE · กด <b>⋮</b> หรือ <b>⋯</b> มุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์</b> ก่อนใช้งาน
  </div>

  <main id="view" aria-live="polite">
    <div class="card"><p class="muted">กำลังโหลด...</p></div>
  </main>

  <nav class="tabbar">
    <a href="#home" data-tab="home"><span>🏠</span>หน้าแรก</a>
    <a href="#practice" data-tab="practice"><span>📝</span>ฝึก</a>
    <a href="#mock" data-tab="mock"><span>⏱️</span>จำลองสอบ</a>
    <a href="#cards" data-tab="cards"><span>🃏</span>การ์ด</a>
    <a href="#stats" data-tab="stats"><span>📊</span>สถิติ</a>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    // Safety net: if js/app.js never starts (missing upload, very old browser), say so instead of a blank page.
    setTimeout(function () {
      if (window.__appStarted) return;
      document.getElementById("view").innerHTML =
        '<div class="card"><h2>เปิดแอปไม่สำเร็จ</h2>' +
        '<p class="muted">โหลดไฟล์ของแอปไม่ครบ ลองรีเฟรชหน้านี้ ถ้ายังไม่ได้ให้แจ้งผู้ดูแลแอป</p>' +
        '<p class="muted" style="font-size:12px">ผู้ดูแล: ตรวจว่ามีโฟลเดอร์ js และ data อยู่ใน repo</p></div>';
    }, 6000);
  </script>
</body>
</html>
